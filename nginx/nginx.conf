# Public weather-map grids: cap request rate per client IP (see location /api/weather-maps/)
limit_req_zone $binary_remote_addr zone=weathermaps:10m rate=20r/s;

# Radar grid frames: the URL carries ts and v, so a frame never changes under the same URL (see location /api/radar-grid/frame).
# Kept small: 200 MB on disk, in the container's own filesystem (gone after a restart, that is fine).
proxy_cache_path /var/cache/nginx/radar levels=1:2 keys_zone=radar:10m max_size=200m inactive=2h use_temp_path=off;

server {
    listen 80;
    server_name bbqweer.eu www.bbqweer.eu;

    # Let's Encrypt webroot challenge (certbot renew) — must stay reachable over plain HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bbqweer.eu www.bbqweer.eu;

    ssl_certificate     /etc/letsencrypt/live/bbqweer.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bbqweer.eu/privkey.pem;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Angular — hash routing, all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Hashed assets — cache 1 year
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Socket.IO — WebSocket upgrade required
    location /socket.io/ {
        proxy_pass         http://nodejs:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
    }

    # Weather-map grids are public: rate-limit per IP (a full map view loads a few dozen fields at once)
    location /api/weather-maps/ {
        limit_req          zone=weathermaps burst=60 nodelay;
        proxy_pass         http://nodejs:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Radar grids (rainradar page) are public too: same rate limit. Only /frame is cached; /frames and /days always go to the backend
    location /api/radar-grid/ {
        limit_req          zone=weathermaps burst=60 nodelay;
        proxy_pass         http://nodejs:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/radar-grid/frame {
        limit_req          zone=weathermaps burst=60 nodelay;
        proxy_cache        radar;
        proxy_cache_key    $request_uri;
        proxy_cache_valid  200 1h;
        add_header         X-Cache-Status $upstream_cache_status;
        proxy_pass         http://nodejs:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy API calls to Node backend
    location /api/ {
        proxy_pass         http://nodejs:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    server_name ntfy.bbqweer.eu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ntfy.bbqweer.eu;

    ssl_certificate     /etc/letsencrypt/live/bbqweer.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bbqweer.eu/privkey.pem;

    location / {
        proxy_pass         http://ntfy:80;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}
