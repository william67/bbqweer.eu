services:
  redis:
    ports:
      - "6379:6379"   # expose for local dev (backend runs outside Docker)
  mongodb:
    ports:
      - "127.0.0.1:27018:27017"   # loopback only, for the backend running outside Docker (27017 is often taken by another local Mongo)
  weather-maps:
    profiles:
      - donotstart   # downloads GBs of model data; start explicitly with --profile donotstart
  nginx:
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist/frontend/browser:/usr/share/nginx/html:ro
      - ./nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    profiles:
      - donotstart
  nodejs:
    profiles:
      - donotstart
  certbot:
    profiles:
      - donotstart
  ntfy:
    profiles:
      - donotstart
