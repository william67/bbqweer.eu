# Container log rotation: json-file logs would otherwise grow without a limit.
# Only applies when a container is (re)created.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  mysql:
    image: mysql:8.0
    container_name: bbqweer-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: bbqweer
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
      - ./database/mysql-binlog-expire.cnf:/etc/mysql/conf.d/binlog-expire.cnf:ro
    ports:
      - "127.0.0.1:3306:3306"   # loopback only; reach it remotely via SSH tunnel
    logging: *default-logging

  redis:
    image: redis:8-alpine
    container_name: bbqweer-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    logging: *default-logging

  mongodb:
    image: mongo:7.0.16
    container_name: bbqweer-mongodb
    restart: unless-stopped
    # No ports: only reachable on the compose network (the database has no password). Holds the weather-maps grids.
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    mem_limit: 768m
    volumes:
      - mongodb_data:/data/db
    logging: *default-logging

  weather-maps:
    build: ./weather-maps
    container_name: bbqweer-weather-maps
    restart: unless-stopped
    depends_on:
      - mongodb
      - mysql
    cpus: 1.0
    cpu_shares: 128
    mem_limit: 1g
    volumes:
      - ./weather-maps/config.ini:/app/config.ini:ro
    logging: *default-logging

  nodejs:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bbqweer-nodejs
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
    volumes:
      - ./backend/config.ini:/app/config.ini:ro
    environment:
      NODE_ENV: production
    logging: *default-logging

  nginx:
    image: nginx:alpine
    container_name: bbqweer-nginx
    restart: unless-stopped
    depends_on:
      - nodejs
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist/frontend/browser:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/bbqweer/certbot_certs:/etc/letsencrypt:ro
      - /opt/bbqweer/certbot_www:/var/www/certbot:ro
    logging: *default-logging

  certbot:
    image: certbot/certbot
    volumes:
      - /opt/bbqweer/certbot_certs:/etc/letsencrypt
      - /opt/bbqweer/certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"
    logging: *default-logging

  ntfy:
    image: binwiederhier/ntfy
    container_name: bbqweer-ntfy
    restart: unless-stopped
    command: serve
    environment:
      NTFY_BASE_URL: https://ntfy.bbqweer.eu
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_data:/var/lib/ntfy
    logging: *default-logging

volumes:
  mysql_data:
  mongodb_data:
  ntfy_cache:
  ntfy_data:
